[package]
name = "cachecat"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A better Second Life Cache Viewer. Lightweight and dependable with semantic image search."
repository = "https://github.com/voidel/CacheCat"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
jpeg2k = { version = "0.10", default-features = false, features = ["image", "openjpeg-sys"] }
ort = "=2.0.0-rc.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
uuid = "1"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["directml"] }
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["coreml"] }

[features]
cuda = ["ort/cuda"]

[patch.crates-io]
# GPUI -> async-tar still uses xattr 0.2.3, whose Linux errno alias was removed.
xattr = { path = "vendor/xattr" }

[profile.release]
lto = "thin"
strip = true
