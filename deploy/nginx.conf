server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    location = /cachecat { return 308 /cachecat/; }
    location = /cachecat/app { return 308 /cachecat/app/; }
    location /cachecat/ {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
    location / { return 404; }
}
